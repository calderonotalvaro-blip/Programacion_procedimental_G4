<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css" />
    <link rel="stylesheet" href="/Programaci-nProcedimental-/restaurante/css/usuarios.css">
    <title>usuarios</title>
</head>

<body>
    <div class="box">
        <article class="media">
            <div class="media-content">
                <div class="content">

                    <div class="field">
                        <label class="label">Nombre</label>
                        <div class="control">
                            <input id="txtNombre" class="input" type="text" placeholder="maradona">
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">APELLIDO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtApellido" class="input" type="text" placeholder="Text input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">TIPO DE DOCUMENTO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtTipoDoc" class="input" type="text" placeholder="text Input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-exclamation-triangle"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label"># DE DOCUMENTO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtNumDoc" class="input" type="text" placeholder="number input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">TELEFONO</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtTelefono" class="input" type="text" placeholder="number input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">correo electronico</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtCorreo" class="input" type="email" placeholder="email input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">genero</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtGenero" class="input" type="text" placeholder="text input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">cargo</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtCargo" class="input" type="text" placeholder="text input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">fecha de nacimiento</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtFechaNac" class="input" type="date">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field">
                        <label class="label">contraseña</label>
                        <div class="control has-icons-left has-icons-right">
                            <input id="txtContrasena" class="input" type="password" placeholder="password input">
                            <span class="icon is-small is-left">
                                <i class="fas fa-user"></i>
                            </span>
                            <span class="icon is-small is-right">
                                <i class="fas fa-check"></i>
                            </span>
                        </div>
                    </div>

                </div>
                
                <nav class="level is-mobile">
                    <div class="level-left">
                        <a class="level-item" aria-label="reply">
                            <span class="icon is-small">
                                <i class="fas fa-reply" aria-hidden="true"></i>
                            </span>
                        </a>
                        <a class="level-item" aria-label="retweet">
                            <span class="icon is-small">
                                <i class="fas fa-retweet" aria-hidden="true"></i>
                            </span>
                        </a>
                        <a class="level-item" aria-label="like">
                            <span class="icon is-small">
                                <i class="fas fa-heart" aria-hidden="true"></i>
                            </span>
                        </a>
                    </div>
                </nav>
                
                <div class="field is-grouped mt-4">
                    <div class="control">
                        <button onclick="ValidarDatos()" class="button is-primary">Validar Usuario</button>
                    </div>
                    <div class="control">
                        <a href="../index.html"><button class="button">volver al inicio</button></a>
                    </div>
                </div>
                
            </div>
        </article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="usuarios.js"></script>
</body>

</html>
